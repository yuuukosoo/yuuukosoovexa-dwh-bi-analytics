services:
  postgres:
    image: postgres:16-alpine
    container_name: yuuukosoovexa_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TIMEZONE:-Asia/Makassar}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/sql
      - ./backup:/backup
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: yuuukosoovexa_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: yuuukosoovexa_airflow
    restart: unless-stopped
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow_meta
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Makassar
      AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE: Asia/Makassar
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "True"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TIMEZONE:-Asia/Makassar}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./scheduling:/opt/airflow/dags
      - ./etl:/opt/airflow/project/etl
      - ./sql:/opt/airflow/project/sql
      - ./data:/opt/airflow/project/data
      - ./logs:/opt/airflow/project/logs
      - ./.env:/opt/airflow/project/.env
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        airflow db migrate &&
        (airflow users create --username admin --password admin --firstname Naufal --lastname Khalish --role Admin --email admin@yuuukosoovexa.com || true) &&
        airflow scheduler &
        exec airflow webserver --port 8080

volumes:
  postgres_data:
  pgadmin_data:
